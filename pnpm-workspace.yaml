packages:
  - .
  - ui
  - power-ui
  - power-backend
  - packages/*
  - extensions/*

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - "acpx"
  - "axios"
  - "basic-ftp"
  - "hono"
  - "openclaw"
  - "@buape/carbon"
  - "vite"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "axios@1.15.0"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"

overrides:
  "@anthropic-ai/sdk": "0.81.0"
  "hono": "4.12.12"
  "@hono/node-server": "1.19.13"
  "axios": "1.15.0"
  "defu": "6.1.5"
  "fast-xml-parser": "5.5.7"
  "request": "npm:@cypress/request@3.0.10"
  "request-promise": "npm:@cypress/request-promise@5.0.0"
  "basic-ftp": "5.2.2"
  "file-type": "22.0.1"
  "form-data": "2.5.4"
  "minimatch": "10.2.4"
  "path-to-regexp": "8.4.0"
  "qs": "6.14.2"
  "node-domexception": "npm:@nolyfill/domexception@^1.0.28"
  "@sinclair/typebox": "0.34.49"
  "tar": "7.5.13"
  "tough-cookie": "4.1.3"
  "yauzl": "3.2.1"

onlyBuiltDependencies:
  - "@discordjs/opus"
  - "@lydell/node-pty"
  - "@matrix-org/matrix-sdk-crypto-nodejs"
  - "@napi-rs/canvas"
  - "@tloncorp/api"
  - "@tloncorp/tlon-skill"
  - "@whiskeysockets/baileys"
  - authenticate-pam
  - esbuild
  - node-llama-cpp
  - protobufjs
  - sharp

ignoredBuiltDependencies:
  - koffi

packageExtensions:
  "@mariozechner/pi-coding-agent":
    dependencies:
      strip-ansi: "^7.2.0"

blockExoticSubdeps: false

allowBuilds:
  '@discordjs/opus': true
  '@matrix-org/matrix-sdk-crypto-nodejs': true
  '@tloncorp/tlon-skill': true
  '@whiskeysockets/baileys': true
  esbuild: true
  koffi: false
  node-llama-cpp: true
  protobufjs: true
  sharp: true
